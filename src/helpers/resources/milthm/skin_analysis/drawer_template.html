<body>
    <h1>Milthm Skin Analyze Result</h1>
    <h2 id="skin_name"></h2>
    <button id="save">Save as respack</button>

    <div id="save settings">
        <h3>Settings</h3>
        <span>Scale: </span> <input id="settings-scale" type="number" value="4.0" min="0.5" max="32.0"> <br>
        <span>Meta-sharedStoryboardAssetsSkin: </span> <input id="settings-meta-sharedStoryboardAssetsSkin" type="number" value="0" min="0" step="1"> <br>
        <span>Meta-i18nChose: </span> <input id="settings-meta-i18nChose" value="zh_hans"> <br>
        <span>Meta-isChina: </span> <input id="settings-meta-isChina" type="checkbox" checked> <br>
    </div>

    <div id="tap">
        <h3>Tap</h3>
        <canvas id="tap_canvas"></canvas>
    </div>

    <div id="tap_double">
        <h3>Tap Double</h3>
        <canvas id="tap_double_canvas"></canvas>
    </div>

    <div id="drag">
        <h3>Drag</h3>
        <canvas id="drag_canvas"></canvas>
    </div>

    <div id="hold">
        <h3>Hold</h3>
        <canvas id="hold_canvas"></canvas>
    </div>

    <div id="hold_double">
        <h3>Hold Double</h3>
        <canvas id="hold_double_canvas"></canvas>
    </div>

    <div id="extap">
        <h3>Extap</h3>
        <canvas id="extap_canvas"></canvas>
    </div>

    <div id="extap_double">
        <h3>Extap Double</h3>
        <canvas id="extap_double_canvas"></canvas>
    </div>

    <div id="exhold">
        <h3>Exhold</h3>
        <canvas id="exhold_canvas"></canvas>
    </div>

    <div id="exhold_double">
        <h3>Exhold Double</h3>
        <canvas id="exhold_double_canvas"></canvas>
    </div>

    <div id="line_head">
        <h3>Line Head</h3>
        <canvas id="line_head_canvas"></canvas>
    </div>

    <div id="line_pixel">
        <h3>Line Pixel</h3>
        <canvas id="line_pixel_canvas"></canvas>
    </div>
</body>

<script>/* link canvas2d_ext.js */</script>
<script>/* link jszip/jszip.min.js */</script>
<script>
    const $ = document.querySelector.bind(document);
    const $$ = document.querySelectorAll.bind(document);
    const data = {/* analyzed data */};
    var isSaving = false;

    console.log(data);
    $("#skin_name").innerText = `Name: ${data.skin_name}`;

    const fill_transparent_background = ctx => {
        const block_size = 12;
        if (isSaving) return;
        ctx.save();
        ctx.globalCompositeOperation = "destination-over";
        ctx.resetTransform();

        for (let i=0; i*block_size<ctx.canvas.width; i++) {
            for (let j=0; j*block_size<ctx.canvas.height; j++) {
                ctx.fillStyle = i % 2 == j % 2 ? "#999" : "#eee";
                ctx.fillRect(i*block_size, j*block_size, block_size, block_size);
            }
        }

        ctx.restore();
    };

    const oklchToRgb = (L, c, h, gamma = 1) => {
        const a = c * Math.cos((h *= Math.PI / 180));
        const b = c * Math.sin(h);
        const l = L ** gamma;
        const l1 = l + 0.3963377774 * a + 0.2158037573 * b;
        const m1 = l - 0.1055613458 * a - 0.0638541728 * b;
        const s1 = l - 0.0894841775 * a - 1.291485548 * b;
        const l_ = l1 * l1 * l1;
        const m_ = m1 * m1 * m1;
        const s_ = s1 * s1 * s1;
        const r = 4.0767416621 * l_ - 3.3077115913 * m_ + 0.2309699292 * s_;
        const g = -1.2684380046 * l_ + 2.6097574011 * m_ - 0.3413193965 * s_;
        const b_ = -0.0041960863 * l_ - 0.7034186147 * m_ + 1.707614701 * s_;
        return [r, g, b_].map((x) => Math.max(0, Math.min(1, x)) * 255);
    };

    const rgbToOklch = (r, g, b) => {
        r /= 255; g /= 255; b /= 255;
        const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
        const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
        const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
        const l_ = Math.cbrt(l);
        const m_ = Math.cbrt(m);
        const s_ = Math.cbrt(s);
        const L = 0.2104542553 * l_ + 0.793617785 * m_ - 0.0040720468 * s_;
        const a = 1.9779984951 * l_ - 2.428592205 * m_ + 0.4505937099 * s_;
        const bb = 0.0259040371 * l_ + 0.7827717662 * m_ - 0.808675766 * s_;
        const C = Math.hypot(a, bb);
        const h = ((Math.atan2(bb, a) * 180) / Math.PI + 360) % 360;
        return [L, C, h];
    };

    const arrInterplate = (s, e, t) => s.map((x, i) => x + (e[i] - x) * t);
    const oklchSplitN = 2000;
    const numberInterplateSplitN = 2000;
    const oklchColorIter = function* (sRgb, eRgb, toString = true, ttrans = x => x) {
        const sOklch = rgbToOklch(...sRgb);
        const eOklch = rgbToOklch(...eRgb);
        for (let i=0; i<oklchSplitN; i++) {
            const t = i/oklchSplitN;
            const rgbArr = oklchToRgb(...arrInterplate(sOklch, eOklch, ttrans(t)));
            yield [t, toString ? `rgb(${rgbArr.join(",")})` : rgbArr];
        }
    };
    const rgbColorIter = function* (sRgb, eRgb, toString = true, ttrans = x => x) {
        for (let i=0; i<oklchSplitN; i++) {
            const t = i/oklchSplitN;
            const rgbArr = arrInterplate(sRgb, eRgb, ttrans(t));
            yield [t, toString ? `rgb(${rgbArr.join(",")})` : rgbArr];
        }
    }
    const getColorIter = typ => ({
        rgb: rgbColorIter,
        oklch: oklchColorIter
    })[typ];
    const numberInterplateIter = function* (s, e) {
        for (let i=0; i<numberInterplateSplitN; i++) {
            const t = i/(numberInterplateSplitN-1);
            yield [t, s + (e - s) * t];
        }
    };

    const enumerate = arr => {
        let i = 0;
        return {
            [Symbol.iterator]: () => ({
                next: () => ({value: [i, arr[i++]], done: i >= arr.length})
            })
        };
    };

    const scaleSize = size => [size[0]*SCALE, size[1]*SCALE];
    const fixOrp = p => Math.max(0, Math.min(1, p));
    const dist = (x1, y1, x2, y2) => Math.hypot(x1-x2, y1-y2);
    const rotate = (x, y, angle, r) => [x + r * Math.cos(angle), y + r * Math.sin(angle)];

    const draw_circle_note = (cv, note) => {
        const ctx = cv.getContext("2d");
        ctx.clear();
        const [w, h] = note.size;
        [cv.width, cv.height] = scaleSize(note.size);
        ctx.reset();
        ctx.scale(SCALE, SCALE);

        const shadow_full_radius = note.shadow_extended_radius+note.outter_stroke_circle_radius;
        const shadow_grd = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, shadow_full_radius);
        for (const [i, [t, colorArr]] of enumerate(note.shadow_color)) {
            if (i) {
                const [last_t, last_color] = note.shadow_color[i-1];
                shadow_grd.addColorStop(fixOrp(1-last_t*(note.shadow_extended_radius/shadow_full_radius)), `rgba(${last_color.slice(0, 3).join(",")}, ${last_color[3]/255})`);
            }
            shadow_grd.addColorStop(fixOrp(1-t*(note.shadow_extended_radius/shadow_full_radius)), `rgba(${colorArr.slice(0, 3).join(",")}, ${colorArr[3]/255})`);
        }
        ctx.fillCircle(w/2, h/2, shadow_full_radius, shadow_grd);

        const stroke_grd = ctx.createConicGradient(0, w/2, h/2);
        for (const [t, color] of getColorIter(note.outter_stroke_color_interplate_type)(note.outter_stroke_right_point_color, note.outter_stroke_left_point_color)) stroke_grd.addColorStop(fixOrp(t/2), color);
        for (const [t, color] of getColorIter(note.outter_stroke_color_interplate_type)(note.outter_stroke_left_point_color, note.outter_stroke_right_point_color)) stroke_grd.addColorStop(fixOrp(t/2+0.5), color);
        ctx.fillCircle(w/2, h/2, note.outter_stroke_circle_radius, stroke_grd);

        const fill_grd = ctx.createLinearGradient(w/2-note.inner_fill_circle_radius, h/2, w/2+note.inner_fill_circle_radius, h/2);
        for (const [t, color] of getColorIter(note.inner_fill_color_interplate_type)(note.inner_fill_left_point_color, note.inner_fill_right_point_color)) fill_grd.addColorStop(fixOrp(t), color);
        ctx.fillCircle(w/2, h/2, note.inner_fill_circle_radius, fill_grd);

        fill_transparent_background(ctx);
    };
    
    const draw_tap = () => draw_circle_note($("#tap_canvas"), data.notes.tap);
    const draw_tap_double = () => draw_circle_note($("#tap_double_canvas"), data.notes.tap_double);

    const draw_drag = () => {
        const cv = $("#drag_canvas");
        const ctx = cv.getContext("2d");
        ctx.clear();
        const note = data.notes.drag;
        const [w, h] = note.size;
        [cv.width, cv.height] = scaleSize(note.size);
        ctx.reset();
        ctx.scale(SCALE, SCALE);

        const fill_shape_function = eval(note.fill_shape);

        ctx.beginPath();
        let lastpos = null;
        let first_moved = false;
        let stroke_angle = 0.0;
        const stroke_points = [];
        const strokeHelper = (pos, angle) => {
            const newpos = rotate(...pos, angle, note.stroke_width);
            if (!first_moved) {
                ctx.moveTo(...newpos);
                first_moved = true;
            } else ctx.lineTo(...newpos);
            stroke_points.push(newpos);
        };
        for (const [t, x] of numberInterplateIter(note.fill_start_x, note.fill_end_x)) {
            const y = fill_shape_function(t) * note.fill_max_height;
            const pos = [x, h/2-y];
            if (lastpos !== null) {
                const angle = Math.atan2(pos[1]-lastpos[1], pos[0]-lastpos[0]) - Math.PI/2;
                if (!first_moved && angle > -Math.PI) {
                    for (let i=0; i<numberInterplateSplitN; i++) {
                        const t2 = 1-i/(numberInterplateSplitN-1);
                        const angle2 = angle + (-Math.PI - angle) * t2;
                        strokeHelper(pos, angle2);
                    }
                }
                strokeHelper(pos, angle);
                stroke_angle = angle;
            }
            lastpos = pos;
        }
        if (stroke_angle < 0) {
            const last_2point = [stroke_points[stroke_points.length-2], stroke_points[stroke_points.length-1]];
            const endk = -(last_2point[1][1]-last_2point[0][1])/(last_2point[1][0]-last_2point[0][0]);
            const stroke_endx = last_2point[1][0] + (h/2-last_2point[1][1])/(-endk);
            ctx.lineTo(stroke_endx, h/2);
            stroke_points.push([stroke_endx, h/2]);
        }
        for (let i=stroke_points.length-1; i>=0; i--) {
            const [x, y] = stroke_points[i];
            ctx.lineTo(x, h - y);
        }
        const stroke_lt_pos = stroke_points.reduce((acc, i) => dist(...i, 0, 0) < dist(...acc, 0, 0) ? i : acc, stroke_points[0]);
        const stroke_rt_pos = stroke_points.reduce((acc, i) => dist(...i, w, 0) < dist(...acc, w, 0) ? i : acc, stroke_points[0]);
        const stroke_rb_pos = [stroke_rt_pos[0], h-stroke_rt_pos[1]];
        const stroke_grd = ctx.createLinearGradient(...stroke_lt_pos, ...stroke_rb_pos);
        for (const [t, color] of getColorIter(note.stroke_color_interplate_type)(note.stroke_left_color, note.stroke_right_color)) stroke_grd.addColorStop(fixOrp(t), color);
        ctx.fillStyle = stroke_grd;
        ctx.fill();
        
        ctx.beginPath();
        let fill_rt_pos = [0, h];
        let fill_lb_pos = [w, 0];
        for (const [t, x] of numberInterplateIter(note.fill_start_x, note.fill_end_x)) {
            const y = fill_shape_function(t) * note.fill_max_height;
            const pos = [x, h/2-y];
            if (dist(...pos, w, 0) < dist(...fill_rt_pos, w, 0)) fill_rt_pos = pos;
            if (t === 0) ctx.moveTo(...pos);
            else ctx.lineTo(...pos);
        }
        for (const [t, x] of numberInterplateIter(note.fill_end_x, note.fill_start_x)) {
            const y = fill_shape_function(1-t) * note.fill_max_height;
            const pos = [x, h/2+y];
            if (dist(...pos, 0, h) < dist(...fill_lb_pos, 0, h)) fill_lb_pos = pos;
            ctx.lineTo(...pos);
        }

        const fillGrd = ctx.createLinearGradient(...fill_lb_pos, ...fill_rt_pos);
        for (const [t, color] of getColorIter(note.fill_color_interplate_type)(note.fill_left_color, note.fill_right_color)) fillGrd.addColorStop(fixOrp(t), color);
        ctx.fillStyle = fillGrd;
        ctx.fill();

        fill_transparent_background(ctx);
    };

    const draw_hold_note = (cv, note) => {
        const ctx = cv.getContext("2d");
        ctx.clear();
        const [w, h] = note.size;
        [cv.width, cv.height] = scaleSize(note.size);
        ctx.reset();
        ctx.scale(SCALE, SCALE);

        const draw = (extended, fill) => {
            ctx.beginPath();
            ctx.arc(w/2-note.fill_width/2, h/2, note.fill_height/2+extended, Math.PI/2, -Math.PI/2);
            ctx.lineTo(w/2-note.fill_width/2, h/2-note.fill_height/2-extended);
            ctx.lineTo(w/2+note.fill_width/2, h/2-note.fill_height/2-extended);
            ctx.arc(w/2+note.fill_width/2, h/2, note.fill_height/2+extended, -Math.PI/2, Math.PI/2);
            ctx.fillStyle = fill;
            ctx.fill();
        };

        // const shadow_color_grd = ctx.createConicGradient(0, w/2, h/2);
        // let shadow_circ_halfc = Math.PI * (note.fill_height/2+note.stroke_width+note.shadow_size);
        // console.log(shadow_circ_halfc);
        // shadow_circ_halfc = shadow_circ_halfc / (note.fill_width*2 + shadow_circ_halfc*2);
        // shadow_color_grd.addColorStop(0.5+shadow_circ_halfc/2, `rgb(${note.stroke_left_color.join(",")})`);
        // shadow_color_grd.addColorStop(0.5-shadow_circ_halfc/2, `rgb(${note.stroke_left_color.join(",")})`);
        // for (const [t, color] of getColorIter(note.stroke_color_interplate_type)(note.stroke_left_color, note.stroke_right_color)) {
        //     const t2 = 0.5+shadow_circ_halfc/2 + (1.0-shadow_circ_halfc/2 - (0.5+shadow_circ_halfc/2)) * t;
        //     shadow_color_grd.addColorStop(fixOrp(t2), color);
        //     const t3 = 0.5-shadow_circ_halfc/2 + (shadow_circ_halfc/2 - (0.5-shadow_circ_halfc/2)) * t;
        //     shadow_color_grd.addColorStop(fixOrp(t3), color);
        // }
        // draw(note.stroke_width+note.shadow_size, shadow_color_grd);

        const apply_shadow_alpha_at_grd = (grd, pconv = t => t) => {
            for (const [i, [t, a]] of enumerate(note.shadow_alpha)) {
                if (i) {
                    const [last_t, last_a] = note.shadow_alpha[i-1];
                    grd.addColorStop(pconv(fixOrp(last_t)), `rgba(255,255,255,${last_a/255})`);
                }
                grd.addColorStop(pconv(fixOrp(t)), `rgba(255,255,255,${a/255})`);
            }
        };

        const shadow_leftcirc_grd = ctx.createRadialGradient(w/2-note.fill_width/2, h/2, note.fill_height/2+note.stroke_width, w/2-note.fill_width/2, h/2, note.fill_height/2+note.stroke_width+note.shadow_size);
        apply_shadow_alpha_at_grd(shadow_leftcirc_grd, t => 1-t);
        ctx.fillStyle = shadow_leftcirc_grd;
        ctx.beginPath();
        ctx.arc(w/2-note.fill_width/2, h/2, note.fill_height/2+note.stroke_width+note.shadow_size, Math.PI/2, -Math.PI/2);
        ctx.fill();

        const shadow_top_grd = ctx.createLinearGradient(0, h/2-note.fill_height/2-note.stroke_width-note.shadow_size, 0, h/2-note.fill_height/2-note.stroke_width);
        apply_shadow_alpha_at_grd(shadow_top_grd);
        ctx.fillRectEx(w/2-note.fill_width/2, h/2-note.fill_height/2-note.stroke_width-note.shadow_size, note.fill_width, note.shadow_size, shadow_top_grd);

        const shadow_bottom_grd = ctx.createLinearGradient(0, h/2+note.fill_height/2+note.stroke_width, 0, h/2+note.fill_height/2+note.stroke_width+note.shadow_size);
        apply_shadow_alpha_at_grd(shadow_bottom_grd, t => 1-t);
        ctx.fillRectEx(w/2-note.fill_width/2, h/2+note.fill_height/2+note.stroke_width, note.fill_width, note.shadow_size, shadow_bottom_grd);
        
        const shadow_rightcirc_grd = ctx.createRadialGradient(w/2+note.fill_width/2, h/2, note.fill_height/2+note.stroke_width, w/2+note.fill_width/2, h/2, note.fill_height/2+note.stroke_width+note.shadow_size);
        apply_shadow_alpha_at_grd(shadow_rightcirc_grd, t => 1-t);
        ctx.fillStyle = shadow_rightcirc_grd;
        ctx.beginPath();
        ctx.arc(w/2+note.fill_width/2, h/2, note.fill_height/2+note.stroke_width+note.shadow_size, -Math.PI/2, Math.PI/2);
        ctx.fill();

        ctx.save();
        ctx.globalCompositeOperation = "source-in";
        let shadow_fills;
        if (note.shadow_color_type == "designate") {
            shadow_fills = `rgb(${note.shadow_color.join(",")})`;
        } else {
            shadow_fills = ctx.createLinearGradient(w/2-note.fill_width/2, 0, w/2+note.fill_width/2, 0);
            for (const [t, color] of getColorIter(note.stroke_color_interplate_type)(note.stroke_left_color, note.stroke_right_color)) shadow_fills.addColorStop(fixOrp(t), color);
        }
        draw(note.stroke_width+note.shadow_size, shadow_fills);
        ctx.restore();

        const stroke_grd = ctx.createLinearGradient(w/2-note.fill_width/2, 0, w/2+note.fill_width/2, 0);
        for (const [t, color] of getColorIter(note.stroke_color_interplate_type)(note.stroke_left_color, note.stroke_right_color)) stroke_grd.addColorStop(fixOrp(t), color);
        draw(note.stroke_width, stroke_grd);
        
        const fill_grd = ctx.createLinearGradient(w/2-note.fill_width/2, 0, w/2+note.fill_width/2, 0);
        for (const [t, color] of getColorIter(note.fill_color_interplate_type)(note.fill_left_color, note.fill_right_color)) fill_grd.addColorStop(fixOrp(t), color);
        draw(0, fill_grd);

        fill_transparent_background(ctx);
    };

    const draw_hold = () => draw_hold_note($("#hold_canvas"), data.notes.hold);
    const draw_hold_double = () => draw_hold_note($("#hold_double_canvas"), data.notes.hold_double);
    const draw_extap = () => draw_circle_note($("#extap_canvas"), data.notes.extap);
    const draw_extap_double = () => draw_circle_note($("#extap_double_canvas"), data.notes.extap_double);
    const draw_exhold = () => draw_hold_note($("#exhold_canvas"), data.notes.exhold);
    const draw_exhold_double = () => draw_hold_note($("#exhold_double_canvas"), data.notes.exhold_double);

    const draw_line_head = () => {
        const cv = $("#line_head_canvas");
        const ctx = cv.getContext("2d");
        ctx.clear();
        const line_head = data.line_head;
        const [w, h] = line_head.size;
        [cv.width, cv.height] = scaleSize(line_head.size);
        ctx.reset();
        ctx.scale(SCALE, SCALE);

        ctx.save();
        ctx.beginPath();
        ctx.arc(w/2, h/2, line_head.radius+line_head.stroke_width, 0, 2*Math.PI);
        ctx.clip();
        ctx.arc(w/2, h/2, line_head.radius, 0, 2*Math.PI);
        ctx.clip("evenodd");
        const stroke_grd = ctx.createLinearGradient(0, 0, w, 0);
        for (const [t, color] of getColorIter(line_head.stroke_color_interplate_type)(line_head.stroke_left_color, line_head.stroke_right_color)) stroke_grd.addColorStop(fixOrp(t), color);
        ctx.fillStyle = stroke_grd;
        ctx.fillRectEx(0, 0, w, h);
        ctx.restore();

        fill_transparent_background(ctx);
    };

    const draw_line_pixel = () => {
        const cv = $("#line_pixel_canvas");
        const ctx = cv.getContext("2d");
        ctx.clear();
        const line_pixel = data.line_pixel;
        const [w, h] = line_pixel.size;
        [cv.width, cv.height] = scaleSize(line_pixel.size);
        ctx.reset();
        ctx.scale(SCALE, SCALE);

        ctx.fillStyle = `rgba(${line_pixel.color.slice(0, 3).join(",")}, ${line_pixel.color[3] / 255})`;
        ctx.fillRectEx(0, 0, w, h);

        fill_transparent_background(ctx);
    };

    const renderer = scale => {
        window.SCALE = scale;
        draw_tap();
        draw_tap_double();
        draw_drag();
        draw_hold();
        draw_hold_double();
        draw_extap();
        draw_extap_double();
        draw_exhold();
        draw_exhold_double();
        draw_line_head();
        draw_line_pixel();
    };

    const preview_scale = 1.0;

    $("#save").addEventListener("click", async () => {
        isSaving = true;
        renderer(parseFloat($("#settings-scale").value));
        isSaving = false;

        const getAltas = note => {
            const width = note.fill_width + note.stroke_width*2;
            const altas = (note.size[0] - width) / 2 * SCALE;
            return [altas, altas];
        };

        const zip = new JSZip();
        zip.file("tap.png", $("#tap_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("tap_double.png", $("#tap_double_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("drag.png", $("#drag_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("hold.png", $("#hold_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("hold_double.png", $("#hold_double_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("extap.png", $("#extap_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("extap_double.png", $("#extap_double_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("exhold.png", $("#exhold_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("exhold_double.png", $("#exhold_double_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("line_head.png", $("#line_head_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("line_pixel.png", $("#line_pixel_canvas").toDataURL().split(",")[1], {base64: true});
        zip.file("meta.json", JSON.stringify({
            holdAtlas: getAltas(data.notes.hold),
            holdDoubleAtlas: getAltas(data.notes.hold_double),
            sharedStoryboardAssetsSkin: parseInt($("#settings-meta-sharedStoryboardAssetsSkin").value),
            i18nChose: $("#settings-meta-i18nChose").value,
            isChina: $("#settings-meta-isChina").checked,
        }, null, 4));

        const zipBlob = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(zipBlob);
        a.download = `respack-${data.skin_name}.zip`;
        a.click();
        renderer(preview_scale);
    });

    renderer(preview_scale);
</script>
